<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luminary Nexus - Nexus Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --grid-color: rgba(55, 65, 81, 0.4);
            --bg-color: #030712;
            --pane-bg: rgba(17, 24, 39, 0.8);
            --pane-border: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: #f3f4f6;
            background-image:
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .font-mono { font-family: 'Share Tech Mono', monospace; }
        .glass-pane {
            background-color: var(--pane-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--pane-border);
            border-radius: 1rem;
        }
    </style>
</head>
<body class="p-4 sm:p-6 lg:p-8 flex items-center justify-center min-h-screen">

    <div class="max-w-2xl mx-auto w-full">
        <header class="text-center mb-8">
            <h1 class="text-5xl md:text-6xl font-bold tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-teal-300 via-sky-400 to-indigo-500">
                The Nexus Hub
            </h1>
            <p class="mt-4 text-lg text-neutral-400">Your portal to the Luminary Nexus DAO</p>
        </header>

        <main class="glass-pane p-8 space-y-6">
            <div>
                <button id="connectWalletBtn" class="w-full bg-teal-600 hover:bg-teal-500 text-white font-bold py-3 px-4 rounded-lg transition text-lg">
                    Connect Wallet
                </button>
                <div id="walletInfo" class="hidden mt-6 text-center">
                    <p class="text-neutral-400">Connected as:</p>
                    <p id="userAddress" class="font-mono text-lg text-sky-300 break-all"></p>
                </div>
            </div>

            <div id="dataDisplay" class="hidden space-y-4 pt-6 border-t border-neutral-700">
                <div class="flex justify-between items-center">
                    <p class="text-xl text-neutral-300">LNX Balance:</p>
                    <p id="lnxBalance" class="font-mono text-2xl text-teal-400">---</p>
                </div>
                <div class="flex justify-between items-center">
                    <p class="text-xl text-neutral-300">Voting Power:</p>
                    <p id="votingPower" class="font-mono text-2xl text-indigo-400">---</p>
                </div>
            </div>
        </main>

        <footer class="text-center mt-8">
            <p id="networkStatus" class="text-neutral-500 font-mono">Status: Not Connected</p>
        </footer>
    </div>

    <script src="https://cdn.ethers.io/lib/ethers-6.11.1.umd.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
